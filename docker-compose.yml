services:
  postgres:
    image: postgres:16-alpine
    container_name: drujite-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drujite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drujite}
      POSTGRES_DB: ${POSTGRES_DB:-drujite}
    volumes:
      - drujite_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  drujite_pgdata:
