# CI for pull requests and pushes to the default branch.
name: Backend CI

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - "drujite-server/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "drujite-server/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Gradle check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drujite-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run checks
        run: ./gradlew check --no-daemon
